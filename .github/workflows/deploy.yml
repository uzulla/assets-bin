name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

  deploy:
    # 事故防止のため、デプロイ先をリポジトリの Variables（WORKER_NAME / R2_BUCKET_NAME）で
    # 明示したリポジトリでのみデプロイする。未設定ならテストのみ実行し、このジョブはスキップされる。
    if: vars.WORKER_NAME != '' && vars.R2_BUCKET_NAME != ''
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply deploy target from repository variables
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          grep -v '^[[:space:]]*//' wrangler.jsonc | jq '
            .name = env.WORKER_NAME
            | .vars.R2_BUCKET_NAME = env.R2_BUCKET_NAME
            | .r2_buckets[0].bucket_name = env.R2_BUCKET_NAME
          ' > wrangler.override.json
          mv wrangler.override.json wrangler.jsonc
          echo "Effective config:" && cat wrangler.jsonc

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
